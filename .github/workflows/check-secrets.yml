name: Check secrets

# Checks the repository secrets: each one is set, the real values work against LINE and
# Supabase, and no secret value was ever committed. Values are never printed.
# Run it from the Actions tab (Run workflow) after adding or rotating a secret.
on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/check-secrets.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_LOGIN_CHANNEL_ID: ${{ secrets.LINE_LOGIN_CHANNEL_ID }}
      LIFF_ID: ${{ secrets.LIFF_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to look for leaks in old commits too

      - name: Every secret is set
        run: |
          missing=0
          for name in LINE_CHANNEL_SECRET LINE_CHANNEL_ACCESS_TOKEN LINE_LOGIN_CHANNEL_ID \
                      LIFF_ID SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -n "${!name}" ]; then echo "✓ $name is set"; else echo "✗ $name is missing"; missing=1; fi
          done
          exit $missing

      - name: Values look right
        run: |
          ok=0
          [[ "$LINE_CHANNEL_SECRET" =~ ^[0-9a-f]{32}$ ]] \
            && echo "✓ LINE_CHANNEL_SECRET has the expected format" \
            || { echo "✗ LINE_CHANNEL_SECRET should be 32 hex characters (Basic settings > Channel secret)"; ok=1; }
          [[ "$LINE_LOGIN_CHANNEL_ID" =~ ^[0-9]+$ ]] \
            && echo "✓ LINE_LOGIN_CHANNEL_ID is a number" \
            || { echo "✗ LINE_LOGIN_CHANNEL_ID should be digits only"; ok=1; }
          [[ "$LIFF_ID" == "$LINE_LOGIN_CHANNEL_ID"-* ]] \
            && echo "✓ LIFF_ID belongs to the LINE Login channel" \
            || { echo "✗ LIFF_ID should start with LINE_LOGIN_CHANNEL_ID followed by '-'"; ok=1; }
          [[ "$SUPABASE_URL" =~ ^https://[a-z0-9]+\.supabase\.co/?$ ]] \
            && echo "✓ SUPABASE_URL has the expected format" \
            || { echo "✗ SUPABASE_URL should look like https://<project-ref>.supabase.co"; ok=1; }
          exit $ok

      - name: LINE access token works
        run: |
          status=$(curl -s -o /tmp/bot.json -w '%{http_code}' \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" https://api.line.me/v2/bot/info)
          if [ "$status" = 200 ]; then
            echo "✓ LINE accepted the token (bot: $(jq -r .displayName /tmp/bot.json))"
          else
            echo "✗ LINE rejected the token (HTTP $status)"; exit 1
          fi

      - name: Supabase service role key works
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/")
          if [ "$status" = 200 ]; then
            echo "✓ Supabase accepted the key"
          else
            echo "✗ Supabase rejected the key (HTTP $status)"; exit 1
          fi

      - name: No secret value is committed, in any commit
        run: |
          leaked=0
          for name in LINE_CHANNEL_SECRET LINE_CHANNEL_ACCESS_TOKEN SUPABASE_SERVICE_ROLE_KEY; do
            if git grep -q -F -e "${!name}" $(git rev-list --all) -- 2>/dev/null; then
              echo "✗ $name appears in the repository history"; leaked=1
            else
              echo "✓ $name is not in the repository"
            fi
          done
          exit $leaked
